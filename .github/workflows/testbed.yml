name: Testbed

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  # Shared image build. Both testbed images are built once per run with
  # GHA layer caching, then reused by each downstream job via the image:
  # tags in docker-compose.yml. TESTBED_SKIP_BUILD=1 tells the harness to
  # skip `compose --build` since the images already exist locally.
  build-images:
    name: Build testbed images (cached)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build aim image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: tests/testbed/Dockerfile.aim
          tags: astrolabe-callbacks-testbed-aim:latest
          load: true
          cache-from: type=gha,scope=testbed-aim
          cache-to: type=gha,mode=max,scope=testbed-aim
          outputs: type=docker,dest=/tmp/testbed-aim.tar
      - name: Build client image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: tests/testbed/Dockerfile.client
          tags: astrolabe-callbacks-testbed-client:latest
          load: true
          cache-from: type=gha,scope=testbed-client
          cache-to: type=gha,mode=max,scope=testbed-client
          outputs: type=docker,dest=/tmp/testbed-client.tar
      - name: Upload aim image
        uses: actions/upload-artifact@v4
        with:
          name: testbed-aim-image
          path: /tmp/testbed-aim.tar
          retention-days: 1
      - name: Upload client image
        uses: actions/upload-artifact@v4
        with:
          name: testbed-client-image
          path: /tmp/testbed-client.tar
          retention-days: 1

  fast:
    name: Testbed (Phases A-D + F)
    needs: build-images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@v3
      - name: Download aim image
        uses: actions/download-artifact@v4
        with:
          name: testbed-aim-image
          path: /tmp
      - name: Download client image
        uses: actions/download-artifact@v4
        with:
          name: testbed-client-image
          path: /tmp
      - name: Load images
        run: |
          docker load -i /tmp/testbed-aim.tar
          docker load -i /tmp/testbed-client.tar
      - name: Install package (host side, for pytest)
        run: pip install -e '.[dev]'
      - name: Run fast testbed scenarios
        env:
          TESTBED_SKIP_BUILD: "1"
        run: pytest -m testbed tests/testbed/

  scale-short:
    name: Testbed scale-short (Phase E, dispatch-only)
    needs: build-images
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@v3
      - name: Download aim image
        uses: actions/download-artifact@v4
        with:
          name: testbed-aim-image
          path: /tmp
      - name: Download client image
        uses: actions/download-artifact@v4
        with:
          name: testbed-client-image
          path: /tmp
      - name: Load images
        run: |
          docker load -i /tmp/testbed-aim.tar
          docker load -i /tmp/testbed-client.tar
      - name: Install package (host side, for pytest)
        run: pip install -e '.[dev]'
      - name: Run scale-short scenarios
        env:
          TESTBED_SKIP_BUILD: "1"
        run: pytest -m testbed_scale_short tests/testbed/scenarios/test_sustained.py

  scale-long:
    name: Testbed scale-long (Phase E, hours; dispatch-only)
    needs: build-images
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@v3
      - name: Download aim image
        uses: actions/download-artifact@v4
        with:
          name: testbed-aim-image
          path: /tmp
      - name: Download client image
        uses: actions/download-artifact@v4
        with:
          name: testbed-client-image
          path: /tmp
      - name: Load images
        run: |
          docker load -i /tmp/testbed-aim.tar
          docker load -i /tmp/testbed-client.tar
      - name: Install package (host side, for pytest)
        run: pip install -e '.[dev]'
      - name: Run scale-long scenarios
        env:
          TESTBED_SKIP_BUILD: "1"
        run: pytest -m testbed_scale_long tests/testbed/scenarios/test_sustained.py
