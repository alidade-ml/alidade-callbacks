[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alidade-callbacks"
version = "2.0.0"
description = "Framework-agnostic Aim instrumentation for ML training — train/val callbacks (Composer, Lightning, HuggingFace, raw PyTorch) + post-training eval logging"
requires-python = ">=3.10"
authors = [{ name = "Nathan Paull" }]
readme = "README.md"
license = { text = "MIT" }
keywords = [
    "aim",
    "ml-tracking",
    "astrolabe",
    "composer",
    "mosaicml",
    "pytorch-lightning",
    "lightning",
    "huggingface",
    "transformers",
    "pytorch",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Base install pulls only Aim + loguru. Framework-specific callbacks
# live behind extras so users install only what they use.
dependencies = [
    "aim>=3.18",
    "loguru>=0.7",
]

[project.optional-dependencies]
composer = ["mosaicml>=0.20"]
lightning = ["lightning>=2.0"]
# transformers>=4.42 requires accelerate for the PyTorch Trainer
# backend. Anyone instantiating a Trainer with our AstrolabeHFTrainerCallback
# hits ImportError without it; testbed caught the gap.
hf = ["transformers>=4.30", "accelerate>=1.1.0"]
# Checkpoint export only. The stamping path (metadata into a framework
# -native checkpoint) needs nothing extra; this is required solely to
# WRITE .safetensors.
safetensors = ["safetensors>=0.4"]
# `all` is the convenience extra for users who don't want to think
# about which framework they need. Most users should pick a single one.
all = [
    "mosaicml>=0.20",
    "lightning>=2.0",
    "transformers>=4.30",
    "accelerate>=1.1.0",
    "safetensors>=0.4",
]
dev = [
    "pytest>=7.0",
    "mosaicml>=0.20",
    "lightning>=2.0",
    "transformers>=4.30",
    "accelerate>=1.1.0",
    "safetensors>=0.4",
    # pandas is needed on the host running pytest — the testbed's
    # assertion helpers pull metric values via aim's ``.dataframe()``,
    # which returns a pandas DataFrame and imports pandas at call time.
    # Framework deps above happen to pull pandas transitively locally,
    # but the resolver picks a slimmer chain on CI where pandas isn't
    # guaranteed. Pin explicitly so tests never depend on the shape of
    # transitive resolution.
    "pandas>=2.0",
]

[project.urls]
Homepage = "https://github.com/naston/alidade-callbacks"
Issues = "https://github.com/naston/alidade-callbacks/issues"
"Astrolabe" = "https://github.com/naston/astrolabe"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "testbed: integration tests against a real aim server subprocess; excluded from default runs",
    "testbed_scale_short: sustained-load scenarios that finish in <30min (burst throughput + resource invariants); run on PR + dispatch",
    "testbed_scale_long: sustained-load scenarios that run for hours (1hr + 4hr durations); dispatch-only",
]
addopts = "-m 'not testbed and not testbed_scale_short and not testbed_scale_long'"
